<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Sport Elo Predictor</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><h1>Multi-Sport Elo Predictor</h1><p>Database-backed predictions for tennis, NFL, NHL, MLB, NBA, and the Premier League.</p></header>
<section class="panel"><div class="grid"><label>Sport<select id="sport"></select></label><label>Home / Player A<select id="home"></select></label><label>Away / Player B<select id="away"></select></label></div><button id="predict">Predict matchup</button><div id="prediction" class="prediction"></div></section>
<section class="panel"><h2>Elo leaderboard</h2><div id="leaderboard"></div></section><section class="panel"><h2>Recent matchups</h2><div id="matches"></div></section></main><script src="/app.js"></script></body></html>
